[project]
name = "lminfer"
version = "0.0.0"
description = "lminfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "torch",
    "numpy",
    "xxhash",
    "safetensors"
]

[project.optional-dependencies]
npu = [
    "torch_npu"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = false

[[tool.uv.index]]
name = "ascend"
url = "https://mirrors.huaweicloud.com/ascend/repos/pypi/"
default = false
